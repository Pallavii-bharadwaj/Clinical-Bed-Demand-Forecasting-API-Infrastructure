name: Test on Push
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install fastapi uvicorn scikit-learn pandas numpy joblib pydantic
      - name: Train model
        run: python3 train_model.py
      - name: Test health endpoint
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hospital-bed-api .
      - name: Run container and test health endpoint
        run: |
          docker run -d -p 8000:8000 --name api hospital-bed-api
          sleep 5
          curl -f http://localhost:8000/health
          docker stop api
